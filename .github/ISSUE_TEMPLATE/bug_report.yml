name: 🐛 Bug report
description: Something is broken in a game, room, or the leaderboard
labels: [bug]
body:
  - type: input
    id: game
    attributes:
      label: Game or page
      placeholder: e.g. Border Count, multiplayer room, leaderboard
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected, what you saw, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser / device
